name: Android APK
on:
  push:
    branches: ['claude/**', main]
  # 서명 키 캐시는 7일 동안 안 쓰면 GitHub가 지운다. 매주 한 번 꺼내 봐서 살려 둔다.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      new_key:
        description: '서명 키를 새로 만들기 (이미 설치한 앱은 지우고 다시 설치해야 함)'
        type: boolean
        default: false
jobs:
  keep-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
          fail-on-cache-miss: true
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 서명 키 캐시 (빌드마다 같은 키를 써야 업데이트 설치가 됨, 저장소에는 넣지 않음)
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: 서명 키가 없으면 멈춘다 (다른 키로 만든 APK는 업데이트 설치가 안 됨)
        if: steps.ks.outputs.cache-hit != 'true' && inputs.new_key != true
        run: |
          echo "::error::서명 키 캐시가 없어요. 이대로 만들면 기존 앱 위에 업데이트할 수 없어요. 꼭 새 키가 필요하면 Run workflow에서 new_key를 켜세요."
          exit 1
      - name: 서명 키를 새로 만든다
        if: steps.ks.outputs.cache-hit != 'true' && inputs.new_key == true
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: 이 키로 서명하게 지정
        run: echo "SIGN_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: 단위 테스트 + APK 빌드
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: APK 서명이 정해 둔 키와 같은지 확인 (다르면 업데이트 설치가 안 되므로 올리지 않음)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$("$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256" | awk '{print $NF}')
          key=$(keytool -list -v -keystore "$SIGN_KEYSTORE" -storepass android -alias androiddebugkey | grep "SHA256:" | awk '{print $2}' | tr -d : | tr 'A-F' 'a-f')
          want=$(tr -d ' \n' < .github/signing-cert.sha256)
          echo "APK 서명: $apk"
          echo "키 파일:  $key"
          echo "정해 둔 키: $want"
          if [ "$apk" != "$key" ]; then echo "::error::APK가 캐시한 키로 서명되지 않았어요."; exit 1; fi
          if [ "$apk" != "$want" ]; then
            if [ "${{ inputs.new_key }}" = "true" ]; then
              echo "::warning::새 키예요. .github/signing-cert.sha256 을 $apk 로 바꿔 두세요."
            else
              echo "::error::정해 둔 서명 키와 달라요. 이 APK는 기존 앱 위에 업데이트 설치가 안 돼요."; exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: study-lock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
