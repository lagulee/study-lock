name: Android APK
on:
  push:
    branches: ['claude/**', main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 서명 키 캐시 (빌드마다 같은 키를 써야 업데이트 설치가 됨, 저장소에는 넣지 않음)
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: 서명 키가 없으면 새로 만든다
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: 단위 테스트 + APK 빌드
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: study-lock-apk
          path: app/build/outputs/apk/debug/app-debug.apk
