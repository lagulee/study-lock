name: 화면 스크린샷
# 가상 폰·탭에서 모든 화면을 찍어 claude/project-thread-pdxor2 브랜치의 shots/ 에 올린다(화면 겹침·가려짐 점검용).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/src/**', 'scripts/ui-shots.sh', '.github/workflows/ui-shots.yml']
permissions:
  contents: write
concurrency: { group: ui-shots, cancel-in-progress: true }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: 앱·스크린샷 테스트 빌드
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: 가상 기기 가속(KVM) 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 가상 기기에서 찍기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ui-shots.sh
      - name: 스크린샷 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=claude/project-thread-pdxor2
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git clone -q --depth 1 -b "$B" "$URL" pub 2>/dev/null; then :; else
            mkdir pub && cd pub && git init -q && git checkout -q -b "$B" && cd ..
          fi
          rm -rf pub/shots && mkdir -p pub/shots && cp shots/*.png pub/shots/
          cd pub
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "화면 스크린샷 (${GITHUB_SHA::7})" || echo "바뀐 것 없음"
          git push -q "$URL" "HEAD:$B"
